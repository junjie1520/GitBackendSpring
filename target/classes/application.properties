spring.application.name=catan

# --- Connexio ---
spring.datasource.url=jdbc:mysql://localhost:3306/catan?createDatabaseIfNotExist=true&allowPublicKeyRetrieval=true&useSSL=false
spring.datasource.username=root
spring.datasource.password=super3

# --- Actualitzacio ---
spring.jpa.hibernate.ddl-auto=update

# --- Debug ---
