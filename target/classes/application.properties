spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# --- Open Session in View desactivat (sessio 3) ---
# Les relacions LAZY nomes es poden llegir dins del servei (@Transactional)
spring.jpa.open-in-view=false